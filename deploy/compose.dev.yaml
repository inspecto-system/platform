# Development infrastructure for Inspecto: PostgreSQL (TLS, one database per service),
# S3-compatible object storage (SeaweedFS) and Gotenberg (HTML -> PDF).
# Services themselves run from the IDE during development and connect to the ports
# published on 127.0.0.1 only.
#
#   cp deploy/.env.example deploy/.env      # then change the passwords
#   docker compose -f deploy/compose.dev.yaml --env-file deploy/.env up -d --wait
#
# Application services core, media and report (T-207) start with the "apps" profile; see deploy/e2e.
name: inspecto-dev

services:
  certs:
    # One-shot job: self-signed TLS certificates for PostgreSQL and nginx (development only).
    image: alpine:3.22
    command:
      - sh
      - -ec
      - |
        apk add --no-cache openssl >/dev/null
        if [ ! -f /certs/server.crt ]; then
          openssl req -x509 -newkey rsa:2048 -nodes -days 825 \
            -subj "/CN=postgres" -addext "subjectAltName=DNS:postgres,DNS:localhost,IP:127.0.0.1" \
            -keyout /certs/server.key -out /certs/server.crt
          chown 70:70 /certs/server.key /certs/server.crt
          chmod 600 /certs/server.key
        fi
        # nginx: the developer's computer as seen from the browser and from the Android emulator (10.0.2.2).
        if [ ! -f /nginx-certs/server.crt ]; then
          openssl req -x509 -newkey rsa:2048 -nodes -days 825 \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,DNS:nginx,IP:127.0.0.1,IP:10.0.2.2" \
            -keyout /nginx-certs/server.key -out /nginx-certs/server.crt
          chmod 600 /nginx-certs/server.key
        fi
    volumes:
      - pg-certs:/certs
      - nginx-certs:/nginx-certs

  postgres:
    image: postgres:16-alpine
    depends_on:
      certs:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in deploy/.env}
      CORE_MIGRATOR_PASSWORD: ${CORE_MIGRATOR_PASSWORD:?}
      CORE_APP_PASSWORD: ${CORE_APP_PASSWORD:?}
      MEDIA_MIGRATOR_PASSWORD: ${MEDIA_MIGRATOR_PASSWORD:?}
      MEDIA_APP_PASSWORD: ${MEDIA_APP_PASSWORD:?}
      REPORT_MIGRATOR_PASSWORD: ${REPORT_MIGRATOR_PASSWORD:?}
      REPORT_APP_PASSWORD: ${REPORT_APP_PASSWORD:?}
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
    volumes:
      - pg-data:/var/lib/postgresql/data
      - pg-certs:/certs:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    image: chrislusf/seaweedfs:4.52
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /render-s3-config.sh > /tmp/s3.json
        exec weed server -dir=/data -master.volumeSizeLimitMB=256 -volume.max=0 \
          -s3 -s3.port=8333 -s3.config=/tmp/s3.json -ip.bind=0.0.0.0
    environment:
      S3_MEDIA_ACCESS_KEY: ${S3_MEDIA_ACCESS_KEY:?}
      S3_MEDIA_SECRET_KEY: ${S3_MEDIA_SECRET_KEY:?}
      S3_REPORT_ACCESS_KEY: ${S3_REPORT_ACCESS_KEY:?}
      S3_REPORT_SECRET_KEY: ${S3_REPORT_SECRET_KEY:?}
      S3_ADMIN_ACCESS_KEY: ${S3_ADMIN_ACCESS_KEY:?}
      S3_ADMIN_SECRET_KEY: ${S3_ADMIN_SECRET_KEY:?}
    volumes:
      - s3-data:/data
      - ./seaweedfs/render-s3-config.sh:/render-s3-config.sh:ro
    ports:
      - "127.0.0.1:8333:8333"
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 5s
      retries: 30

  s3-init:
    # One-shot job: creates the buckets (idempotent). The filer may still be starting when S3 is
    # healthy, and "weed shell" reports a failed create only in its output: retry until the bucket is
    # listed, otherwise the services get AccessDenied for a missing bucket.
    image: chrislusf/seaweedfs:4.52
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for bucket in photos reports; do
          for attempt in $$(seq 1 30); do
            echo "s3.bucket.create -name $$bucket" | weed shell -master=s3:9333 > /dev/null 2>&1 || true
            if echo "s3.bucket.list" | weed shell -master=s3:9333 2>/dev/null | grep -q "^ *$$bucket[[:space:]]"; then
              echo "bucket $$bucket ready"
              break
            fi
            if [ "$$attempt" = 30 ]; then echo "bucket $$bucket was not created" >&2; exit 1; fi
            sleep 2
          done
        done
    networks: [data]

  gotenberg:
    image: gotenberg/gotenberg:8.39.0
    command:
      - gotenberg
      # Chromium may load only the files of the current conversion: no network access (SSRF, THREAT_MODEL T-12).
      - --chromium-allow-list=^file:///tmp/.*
      - --chromium-disable-javascript=true
      - --api-timeout=60s
      - --log-level=warn
    ports:
      - "127.0.0.1:3000:3000"
    networks: [render]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Application services (T-207). Started only with the "apps" profile, so the infrastructure for
  # running services from the IDE starts as before. Images are built from the sibling clones:
  #   docker compose -f deploy/compose.dev.yaml --env-file deploy/.env --profile apps up -d --build --wait
  core:
    profiles: [apps]
    build: ../../core-service
    image: inspecto/core-service:dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CORE_DB_URL: jdbc:postgresql://postgres:5432/inspecto_core?sslmode=require
      CORE_DB_APP_PASSWORD: ${CORE_APP_PASSWORD:?}
      CORE_DB_MIGRATOR_PASSWORD: ${CORE_MIGRATOR_PASSWORD:?}
      CORE_MEDIA_URL: http://media:8082
      CORE_MEDIA_CLIENT_SECRET: ${MEDIA_CLIENT_SECRET:?set in deploy/.env, at least 32 characters}
      CORE_REPORT_URL: http://report:8083
      CORE_REPORT_CLIENT_SECRET: ${REPORT_CLIENT_SECRET:?set in deploy/.env, at least 32 characters}
      # No CORE_JWT_PRIVATE_KEY: core generates a signing key at start (development only).
    ports:
      - "127.0.0.1:8081:8081"
    networks: [data, services]

  media:
    profiles: [apps]
    build: ../../media-service
    image: inspecto/media-service:dev
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      core:
        condition: service_healthy
    environment:
      MEDIA_DB_URL: postgres://postgres:5432/inspecto_media?sslmode=require
      MEDIA_DB_APP_PASSWORD: ${MEDIA_APP_PASSWORD:?}
      MEDIA_DB_MIGRATOR_PASSWORD: ${MEDIA_MIGRATOR_PASSWORD:?}
      MEDIA_JWKS_URL: http://core:8081/api/v1/.well-known/jwks.json
      MEDIA_CORE_URL: http://core:8081
      MEDIA_CORE_CLIENT_SECRET: ${MEDIA_CLIENT_SECRET:?}
      MEDIA_S3_ENDPOINT: http://s3:8333
      MEDIA_S3_ACCESS_KEY: ${S3_MEDIA_ACCESS_KEY:?}
      MEDIA_S3_SECRET_KEY: ${S3_MEDIA_SECRET_KEY:?}
    ports:
      - "127.0.0.1:8082:8082"
    networks: [data, services]

  report:
    profiles: [apps]
    build: ../../report-service
    image: inspecto/report-service:dev
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      gotenberg:
        condition: service_healthy
      core:
        condition: service_healthy
      media:
        condition: service_healthy
    environment:
      REPORT_DB_URL: postgres://postgres:5432/inspecto_report?sslmode=require
      REPORT_DB_APP_PASSWORD: ${REPORT_APP_PASSWORD:?}
      REPORT_DB_MIGRATOR_PASSWORD: ${REPORT_MIGRATOR_PASSWORD:?}
      REPORT_JWKS_URL: http://core:8081/api/v1/.well-known/jwks.json
      REPORT_CORE_URL: http://core:8081
      REPORT_CORE_CLIENT_SECRET: ${REPORT_CLIENT_SECRET:?}
      REPORT_MEDIA_URL: http://media:8082
      REPORT_GOTENBERG_URL: http://gotenberg:3000
      REPORT_S3_ENDPOINT: http://s3:8333
      REPORT_S3_ACCESS_KEY: ${S3_REPORT_ACCESS_KEY:?}
      REPORT_S3_SECRET_KEY: ${S3_REPORT_SECRET_KEY:?}
    ports:
      - "127.0.0.1:8083:8083"
    # The only service in "render": Gotenberg is reachable from report-service alone.
    networks: [data, services, render]

  nginx:
    # Single entry point (ADR-013, T-505): https://localhost:8443/api/v1/... (port NGINX_HTTPS_PORT).
    profiles: [apps]
    image: nginx:1.30.6-alpine
    depends_on:
      certs:
        condition: service_completed_successfully
      core:
        condition: service_healthy
      media:
        condition: service_healthy
      report:
        condition: service_healthy
    # The image's default site would answer plain HTTP for "localhost": only the rendered templates stay.
    entrypoint: ["/bin/sh", "-c", "rm -f /etc/nginx/conf.d/default.conf && exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    environment:
      NGINX_HTTPS_PORT: ${NGINX_HTTPS_PORT:-8443}
      NGINX_HSTS_MAX_AGE: ${NGINX_HSTS_MAX_AGE:-31536000}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - nginx-certs:/etc/nginx/certs:ro
    ports:
      - "127.0.0.1:${NGINX_HTTP_PORT:-8080}:80"
      - "127.0.0.1:${NGINX_HTTPS_PORT:-8443}:443"
    networks: [services]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://127.0.0.1/api/v1/.well-known/jwks.json"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  data: {}
  render: {}
  # core, media, report and nginx talk to each other here.
  services: {}

volumes:
  pg-data: {}
  pg-certs: {}
  nginx-certs: {}
  s3-data: {}
