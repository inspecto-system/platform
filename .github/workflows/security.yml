# Reusable workflow: security checks common to every repository.
# - Gitleaks: secrets in the full history.
# - Dependency Review: blocks PRs that add dependencies with known High/Critical vulnerabilities.
# - CodeQL: static security analysis for the given language.
name: security

on:
  workflow_call:
    inputs:
      codeql-language:
        description: CodeQL language (java-kotlin, go, javascript-typescript, python) or empty to skip.
        type: string
        default: ""
      codeql-build-mode:
        description: CodeQL build mode (none, autobuild, manual).
        type: string
        default: none

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --verbose

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL
    if: inputs.codeql-language != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ inputs.codeql-language }}
          build-mode: ${{ inputs.codeql-build-mode }}
          queries: security-extended
      - uses: github/codeql-action/analyze@f3bbb05694c2f74569081c28664c0866d64dec21 # v4.39.3
