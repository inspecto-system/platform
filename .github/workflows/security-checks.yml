name: security

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write # required by the reusable workflow (CodeQL job), even when skipped

jobs:
  security:
    uses: ./.github/workflows/security.yml
