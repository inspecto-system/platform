# Reusable workflow: the checks of CODE_QUALITY.md §2 for Python (ml): ruff format, ruff (incl. bandit
# rules S), mypy --strict, pytest with the coverage threshold of the project (pyproject: fail_under).
# The project is managed by uv: pyproject.toml pins the uv version ([tool.uv] required-version),
# .python-version — the Python version, uv.lock — exact dependency versions (installed with --locked).
name: python

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory of the Python project (pyproject.toml, uv.lock).
        type: string
        default: .

permissions:
  contents: read

jobs:
  build:
    name: Format, lint, typecheck, test (${{ inputs.working-directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: ${{ inputs.working-directory }}
          enable-cache: true
          cache-dependency-glob: ${{ inputs.working-directory }}/uv.lock
      - name: Install (lockfile only)
        run: uv sync --locked
      - name: Format
        run: uv run --locked ruff format --check .
      - name: Lint
        run: uv run --locked ruff check .
      - name: Typecheck
        run: uv run --locked mypy
      - name: Tests with coverage threshold
        run: uv run --locked pytest --cov
