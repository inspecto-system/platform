# Reusable workflow: build, static analysis and tests for a Java/Gradle service.
# Runs `./gradlew build`, which in Inspecto services includes Spotless, Checkstyle, PMD,
# SpotBugs, unit and integration tests (Testcontainers) and JaCoCo coverage verification.
name: java-gradle

on:
  workflow_call:
    inputs:
      java-version:
        description: JDK version (Temurin).
        type: string
        default: "21"

permissions:
  contents: write # dependency graph submission

jobs:
  build:
    name: Build, analyse, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          dependency-graph: generate-and-submit
      - name: Gradle build
        run: ./gradlew build --no-daemon --stacktrace
      - name: Print analysis findings
        if: failure()
        run: |
          for f in build/reports/spotbugs/*.txt; do [ -f "$f" ] && { echo "== $f"; cat "$f"; }; done
          for f in build/reports/pmd/*.txt build/reports/checkstyle/*.txt; do [ -f "$f" ] && { echo "== $f"; cat "$f"; }; done
          true
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-reports
          path: |
            build/reports/
            build/test-results/
          retention-days: 7
